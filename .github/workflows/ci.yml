name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
      - uses: pnpm/action-setup@v4
      - name: Runtime versions
        run: |
          node --version
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
